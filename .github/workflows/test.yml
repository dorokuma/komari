name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端嵌入产物（web/public/defaultTheme/*）不入 git，go test/vet/build 都依赖它，
  # 因此测试 job 先构建 default theme，再经 make check 唯一入口校验。
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend

  test:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # make check 的 gofmt 增量检查需要 upstream/main 的完整 merge-base
          fetch-depth: 0

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/komari-monitor/komari.git || true
          git fetch upstream main

      # 唯一检查入口（与本地一致）：增量 gofmt 零差异 + vet + test + race + build-check。
      - name: Run checks
        run: make check
